[project]
name = "rag"
version = "0.1.0"
description = "RAG analyst over SEC 10-K filings with on-demand ingestion and cited answers"
readme = "README.md"
authors = [
    { name = "Raman Saini", email = "ramamsaini1297@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.0",
    "fastapi>=0.115",
    "langchain>=1.5.2",
    "langchain-community>=0.4.2",
    "langchain-core>=1.8.4",
    "langchain-text-splitters>=1.0",
    "openai>=3.57.0",
    "pymupdf>=2.1",
    "pypdf>=7.1.1",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "uvicorn>=0.30",
]

[project.scripts]
rag = "rag.cli:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
